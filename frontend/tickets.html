<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets - Helpdesk</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Help<span>desk</span></div>
    <div class="whoami" id="whoami"></div>
    <button class="secondary" id="logout">Sign out</button>
  </header>

  <main class="container">
    <p class="error" id="error" hidden></p>

    <section class="panel">
      <h2>Raise a ticket</h2>
      <form id="create-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required
                 placeholder="Short summary of the problem">
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" required
                    placeholder="What happened, and what did you expect?"></textarea>
        </div>

        <!-- Only agents and admins may set priority, so this is hidden for
             customers by js/tickets.js. -->
        <div class="field" id="priority-field" hidden>
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="URGENT">Urgent</option>
          </select>
        </div>

        <button type="submit" id="create-submit">Create ticket</button>
      </form>
    </section>

    <div class="toolbar">
      <div class="field">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="">All</option>
          <option value="OPEN">Open</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="RESOLVED">Resolved</option>
          <option value="CLOSED">Closed</option>
        </select>
      </div>

      <div class="field">
        <label for="filter-priority">Priority</label>
        <select id="filter-priority">
          <option value="">All</option>
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="URGENT">Urgent</option>
        </select>
      </div>

      <div class="field" style="flex:2 1 220px">
        <label for="filter-search">Search</label>
        <input type="search" id="filter-search" placeholder="Title, description, or requester">
      </div>

      <button class="secondary" id="clear-filters">Clear</button>
    </div>

    <p id="count" style="color:var(--ink-soft);font-size:14px"></p>
    <div class="ticket-list" id="list"></div>
  </main>

  <script type="module" src="js/tickets.js"></script>
</body>
</html>
